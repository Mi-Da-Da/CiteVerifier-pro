<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#020817;color:#fff;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}.stage{position:relative;width:100vw;height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 46%,rgba(39,130,255,.22),transparent 28%),radial-gradient(circle at 72% 68%,rgba(37,224,183,.16),transparent 30%),linear-gradient(135deg,#020817 0%,#07162a 54%,#030a16 100%)}.vignette{position:absolute;inset:0;background:radial-gradient(circle,transparent 42%,rgba(0,0,0,.52) 100%);z-index:20;pointer-events:none}.noise{position:absolute;inset:0;opacity:.16;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:34px 34px;animation:gridDrift 8s ease-in-out forwards}.scanline{position:absolute;left:-10%;right:-10%;top:-20%;height:18%;background:linear-gradient(180deg,transparent,rgba(91,196,255,.24),rgba(45,232,190,.18),transparent);filter:blur(1px);animation:scan 5.7s cubic-bezier(.3,.05,.2,1) forwards}.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#98eaff;box-shadow:0 0 12px #98eaff;opacity:0;animation:spark 5.5s ease-in-out infinite}.s1{left:12%;top:22%;animation-delay:.2s}.s2{left:22%;top:78%;animation-delay:1.1s}.s3{left:38%;top:17%;animation-delay:.7s}.s4{left:66%;top:22%;animation-delay:1.6s}.s5{left:82%;top:70%;animation-delay:.45s}.s6{left:74%;top:44%;animation-delay:2.1s}.card{position:absolute;width:250px;min-height:106px;padding:16px 18px;border:1px solid rgba(145,205,255,.26);border-radius:8px;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.045));box-shadow:0 18px 52px rgba(0,0,0,.28);backdrop-filter:blur(12px);opacity:0;transform:translate3d(var(--x),var(--y),0) rotate(var(--r)) scale(.86);animation:cardIn 1.2s var(--d) cubic-bezier(.2,.9,.2,1) forwards,cardToCore 1.25s 3.55s cubic-bezier(.65,0,.2,1) forwards}.card:before{content:"";display:block;width:72px;height:7px;border-radius:999px;background:rgba(157,220,255,.42);margin-bottom:12px}.card:after{content:"";position:absolute;left:18px;right:18px;bottom:15px;height:1px;background:linear-gradient(90deg,rgba(157,220,255,.46),transparent)}.card b{display:block;font-size:17px;color:#eaf8ff;margin-bottom:8px}.card span{display:block;font-size:12px;line-height:1.6;color:rgba(231,246,255,.72)}.bad{border-color:rgba(255,97,105,.42)}.bad .stamp{position:absolute;right:12px;top:12px;padding:4px 8px;border:1px solid rgba(255,92,99,.64);border-radius:4px;color:#ff7379;font-weight:700;font-size:13px;opacity:0;transform:scale(.72) rotate(-10deg);animation:stamp .48s 2.75s ease-out forwards}.bad{animation:cardIn 1.2s var(--d) cubic-bezier(.2,.9,.2,1) forwards,badOut .9s 3.45s ease-in forwards}.c1{--x:-440px;--y:-178px;--r:-9deg;--d:.25s}.c2{--x:425px;--y:-155px;--r:8deg;--d:.48s}.c3{--x:-480px;--y:145px;--r:7deg;--d:.72s}.c4{--x:420px;--y:168px;--r:-7deg;--d:.94s}.c5{--x:0px;--y:250px;--r:2deg;--d:1.16s}.laser{position:absolute;left:50%;top:50%;width:1px;height:1px;z-index:8;opacity:0;animation:laserOn 1.2s 2.1s ease-out forwards}.laser:before,.laser:after{content:"";position:absolute;width:42vw;height:1px;background:linear-gradient(90deg,transparent,#42e8ce,transparent);box-shadow:0 0 20px #42e8ce}.laser:before{transform:translate(-50%,-50%) rotate(22deg)}.laser:after{transform:translate(-50%,-50%) rotate(-22deg)}.core{position:absolute;left:50%;top:50%;width:250px;aspect-ratio:1;transform:translate(-50%,-50%) scale(.58);border-radius:50%;border:1px solid rgba(148,215,255,.34);opacity:0;z-index:10;animation:coreIn 1s 3.85s cubic-bezier(.2,.9,.2,1) forwards,corePulse 2.4s 4.8s ease-in-out infinite}.core:before{content:"";position:absolute;inset:14px;border-radius:50%;border:1px dashed rgba(49,224,185,.56);animation:rotate 9s linear infinite}.core:after{content:"";position:absolute;inset:46px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),rgba(58,160,255,.08));box-shadow:inset 0 0 42px rgba(79,196,255,.22)}.shield{position:absolute;left:50%;top:50%;width:78px;height:90px;transform:translate(-50%,-50%) scale(.7);z-index:12;opacity:0;animation:shieldIn .7s 4.35s ease-out forwards}.shield svg{width:100%;height:100%;filter:drop-shadow(0 0 18px rgba(87,230,205,.65))}.brand{position:absolute;left:50%;top:50%;z-index:15;transform:translate(-50%,-50%) translateY(166px);text-align:center;opacity:0;animation:brandIn .9s 4.75s ease-out forwards,brandExit .75s 7.15s ease-in forwards}.brand h1{margin:0;font-size:clamp(58px,7vw,106px);line-height:.95;letter-spacing:0;font-weight:900;text-shadow:0 18px 60px rgba(0,0,0,.48)}.brand p{margin:18px 0 0;font-size:clamp(20px,2vw,31px);font-weight:600;color:#b8edff}.tag{position:absolute;left:50%;top:11vh;transform:translateX(-50%) translateY(-18px);z-index:15;padding:8px 18px;border:1px solid rgba(157,220,255,.3);border-radius:999px;background:rgba(255,255,255,.065);color:#b9ddff;font-size:16px;opacity:0;animation:tagIn .72s .18s ease-out forwards,tagOut .5s 6.95s ease-in forwards}.transition{position:absolute;inset:0;z-index:30;pointer-events:none;opacity:0;animation:transitionOn 1.65s 7.1s ease-in-out forwards}.transition:before{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,255,255,.82) 0%,rgba(200,246,255,.56) 34%,rgba(90,224,198,.26) 62%,rgba(90,224,198,0) 76%);filter:blur(18px);box-shadow:0 0 52px rgba(170,246,255,.38),0 0 140px rgba(53,224,183,.26);animation:iris 1.55s 7.2s cubic-bezier(.72,0,.16,1) forwards}.transition:after{content:"进入平台首页";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);font-size:clamp(38px,4.8vw,74px);font-weight:850;color:#09264c;white-space:nowrap;opacity:0;animation:nextText .72s 8s ease-out forwards}.next-bg{position:absolute;inset:0;z-index:28;background:linear-gradient(135deg,#f7fbff 0%,#fff 50%,#e9fbf6 100%);opacity:0;animation:nextBg 1.05s 7.72s ease-out forwards}.next-bg:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(13,75,132,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(13,75,132,.055) 1px,transparent 1px);background-size:42px 42px}@keyframes gridDrift{from{opacity:0;transform:scale(1.08)}18%{opacity:.16}to{opacity:.11;transform:scale(1)}}@keyframes scan{0%{transform:translateY(0);opacity:0}16%{opacity:1}100%{transform:translateY(720%);opacity:0}}@keyframes spark{0%,100%{opacity:0;transform:scale(.4)}42%{opacity:.85;transform:scale(1.3)}}@keyframes cardIn{0%{opacity:0;filter:blur(6px);transform:translate3d(calc(var(--x)*1.25),calc(var(--y)*1.25),0) rotate(var(--r)) scale(.78)}100%{opacity:1;filter:blur(0);transform:translate3d(var(--x),var(--y),0) rotate(var(--r)) scale(1)}}@keyframes cardToCore{to{opacity:0;filter:blur(4px);transform:translate3d(0,0,0) rotate(0) scale(.34)}}@keyframes badOut{0%{opacity:1}45%{opacity:1;filter:none}100%{opacity:0;filter:blur(6px);transform:translate3d(var(--x),calc(var(--y) + 60px),0) rotate(calc(var(--r) + 8deg)) scale(.86)}}@keyframes stamp{to{opacity:1;transform:scale(1) rotate(-10deg)}}@keyframes laserOn{0%{opacity:0;transform:scale(.5)}35%{opacity:1}100%{opacity:0;transform:scale(1.4)}}@keyframes coreIn{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}@keyframes corePulse{0%,100%{box-shadow:0 0 46px rgba(65,165,255,.18)}50%{box-shadow:0 0 92px rgba(65,224,198,.36)}}@keyframes rotate{to{transform:rotate(360deg)}}@keyframes shieldIn{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}@keyframes brandIn{to{opacity:1;transform:translate(-50%,-50%) translateY(154px)}}@keyframes brandExit{to{opacity:0;filter:blur(10px);transform:translate(-50%,-50%) translateY(120px) scale(1.08)}}@keyframes tagIn{to{opacity:1;transform:translateX(-50%) translateY(0)}}@keyframes tagOut{to{opacity:0;transform:translateX(-50%) translateY(-16px)}}@keyframes transitionOn{0%{opacity:0}5%{opacity:1}100%{opacity:1}}@keyframes nextBg{0%{opacity:0}100%{opacity:.96}}@keyframes iris{0%{width:8px;height:8px;border-radius:50%;opacity:0}25%{opacity:.78}72%{opacity:.72}100%{width:160vw;height:160vw;border-radius:50%;opacity:.58}}@keyframes nextText{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}

<body><main class="stage"><div class="noise"></div><div class="scanline"></div><div class="star s1"></div><div class="star s2"></div><div class="star s3"></div><div class="star s4"></div><div class="star s5"></div><div class="star s6"></div><div class="tag">AI 幻觉引用智能核验</div><article class="card c1"><b>[12] 真实论文引用</b><span>Title / Authors / Venue / Year<br>多源数据库匹配中</span></article><article class="card c2 bad"><b>[08] 疑似虚假引用</b><span>格式完整，但来源不可追溯<br>等待真实性判定</span><i class="stamp">异常</i></article><article class="card c3"><b>[21] 中文学术文献</b><span>标题清洗 / 候选检索<br>相似度匹配</span></article><article class="card c4"><b>[35] DBLP 文献记录</b><span>本地知识库召回<br>高置信度匹配</span></article><article class="card c5 bad"><b>[02] AI 生成引用</b><span>会议、年份、DOI 组合异常<br>需要人工复核</span><i class="stamp">异常</i></article><div class="laser"></div><div class="core"></div><div class="shield"><svg viewBox="0 0 100 118" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M50 6L87 20V50C87 78 71 100 50 111C29 100 13 78 13 50V20L50 6Z" stroke="#DFFBFF" stroke-width="7"/><path d="M31 58L45 72L72 42" stroke="#35E0B7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg></div><section class="brand"><h1>CiteVerifier</h1><p>让每一条引用真实可溯</p></section><div class="next-bg"></div><div class="transition"></div><div class="vignette"></div></main><script>setTimeout(function(){window.parent.postMessage("citeverifier-demo-ended", window.location.origin);}, 9200);</script></body>
